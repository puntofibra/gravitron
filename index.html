<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>GRAVITRÓN</title>
<meta name="theme-color" content="#05060f">
<meta name="description" content="Combina núcleos de energía y GIRA la nave: la gravedad cambia y los combos se disparan.">
<meta property="og:title" content="GRAVITRÓN — gira la nave, desata los combos">
<meta property="og:description" content="Puzzle de combinar con un giro: rota el tablero y cambia la gravedad. ¿Hasta qué nivel llegas?">
<meta property="og:url" content="https://puntofibra.github.io/gravitron/">
<meta property="og:type" content="website">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#05060f;--cy:#2bf0ff;--mg:#ff2bd6;--am:#ffc53b;--gr:#2dff8a;--rd:#ff3355;--tx:#eaf6ff;--mut:#8ea3c4}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:Rajdhani,system-ui,sans-serif;overflow:hidden;touch-action:none}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
input{font-family:Orbitron,monospace;user-select:text;-webkit-user-select:text}
#bg,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#bg{z-index:0}#fx{z-index:50}
.screen{position:fixed;inset:0;z-index:5;display:none;flex-direction:column;align-items:center;justify-content:center;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}
.screen.on{display:flex;animation:fadeIn .45s ease}
@keyframes fadeIn{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
.btn{font-family:Orbitron;font-weight:700;letter-spacing:.12em;font-size:15px;padding:15px 22px;border-radius:14px;position:relative;overflow:hidden;color:#001018;width:100%;max-width:330px;
 background:linear-gradient(135deg,var(--cy),#8afaff);box-shadow:0 0 20px #2bf0ff88,inset 0 -3px 0 #0006;transition:transform .12s}
.btn:active{transform:scale(.95)}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,#fff9 50%,transparent 70%);transform:translateX(-120%);animation:shine 3s infinite}
@keyframes shine{60%,100%{transform:translateX(120%)}}
.btn.mg{background:linear-gradient(135deg,var(--mg),#ff8aee);box-shadow:0 0 20px #ff2bd688,inset 0 -3px 0 #0006;color:#1a0016}
.btn.gh{background:#0b1430cc;color:var(--cy);border:1px solid #2bf0ff66;box-shadow:inset 0 0 14px #2bf0ff22}.btn.gh::after{display:none}
.small{font-size:12px;padding:10px 14px;width:auto}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}
.col{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
/* logo */
.logo{font-family:Orbitron;font-weight:900;font-size:clamp(40px,12vw,96px);letter-spacing:.04em;line-height:1;position:relative;
 background:linear-gradient(180deg,#fff 0%,#9ff8ff 40%,#2bf0ff 60%,#b45bff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 0 14px #2bf0ffaa) drop-shadow(0 0 40px #b45bff66);animation:logoTilt 6s ease-in-out infinite}
@keyframes logoTilt{0%,100%{transform:rotate(0)}25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
.tag{color:var(--mut);letter-spacing:.32em;font-size:14px;text-transform:uppercase;text-align:center}
.orbit{position:relative;width:min(70vw,260px);aspect-ratio:1;margin:6px auto 10px}
.orbit .ring{position:absolute;inset:0;border-radius:50%;border:2px dashed #2bf0ff66;animation:spin 18s linear infinite}
.orbit .ring:nth-child(2){inset:16%;border:2px solid #b45bff55;animation-duration:10s;animation-direction:reverse}
.orbit .gem{position:absolute;width:22%;left:39%;top:39%;animation:orb 7s linear infinite}
.orbit .gem canvas{width:100%;height:auto;display:block}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes orb{from{transform:rotate(var(--a)) translateX(min(30vw,112px)) rotate(calc(-1*var(--a)))}to{transform:rotate(calc(var(--a) + 360deg)) translateX(min(30vw,112px)) rotate(calc(-1*var(--a) - 360deg))}}
.orbit .core{position:absolute;inset:34%;display:grid;place-items:center}
.foot{position:fixed;bottom:max(8px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:12px;color:#5a6b8a;z-index:6}
.foot a{color:#7f93b8}
/* ===== GAME ===== */
#game{padding:0;display:none}
#game.on{display:grid}
#game{grid-template-columns:1fr;grid-template-rows:auto 1fr auto;height:100%}
.hud{display:flex;gap:8px;align-items:stretch;padding:max(10px,env(safe-area-inset-top)) 10px 6px;z-index:6}
.stat{flex:1;min-width:0;background:linear-gradient(160deg,#0c1638dd,#070b1edd);border:1px solid #2bf0ff44;border-radius:14px;padding:6px 8px;text-align:center;box-shadow:inset 0 0 18px #2bf0ff14}
.stat small{display:block;font-size:10px;letter-spacing:.2em;color:var(--mut)}
.stat b{font-family:Orbitron;font-size:clamp(15px,4.6vw,22px);display:block;white-space:nowrap}
.stat.score b{color:#fff;text-shadow:0 0 10px var(--cy)}
.stat.moves b{color:var(--am);text-shadow:0 0 10px var(--am)}
.stat.moves.low b{color:var(--rd);animation:blink .5s infinite}
@keyframes blink{50%{opacity:.4}}
.prog{position:relative;height:8px;border-radius:6px;background:#ffffff14;margin-top:4px;overflow:hidden}
.prog i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,#2bf0ff,#b45bff,#ff2bd6);box-shadow:0 0 10px #2bf0ff;transition:width .5s cubic-bezier(.3,1.4,.5,1)}
.mid{position:relative;display:flex;align-items:center;justify-content:center;min-height:0;gap:18px;padding:0 8px}
.boardWrap{position:relative;flex:none}
.boardFrame{position:absolute;inset:-10px;border-radius:24px;border:2px solid #2bf0ff88;box-shadow:0 0 24px #2bf0ff66,inset 0 0 30px #2bf0ff22;
 background:radial-gradient(circle at 50% 50%,#0d1a4acc,#050817ee);transition:transform .55s cubic-bezier(.65,0,.25,1),border-color .3s,box-shadow .3s}
.boardFrame::before{content:"";position:absolute;inset:-2px;border-radius:24px;padding:2px;background:conic-gradient(from var(--ang,0deg),#2bf0ff,#b45bff,#ff2bd6,#ffc53b,#2bf0ff);
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.8;animation:ang 6s linear infinite}
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes ang{to{--ang:360deg}}
#board{display:block;position:relative;border-radius:14px;transition:transform .55s cubic-bezier(.65,0,.25,1)}
.gravArrow{position:absolute;left:50%;bottom:-34px;transform:translateX(-50%);font-family:Orbitron;font-size:11px;letter-spacing:.2em;color:var(--cy);opacity:.8;white-space:nowrap}
.side{display:flex;flex-direction:column;gap:10px;align-items:center;width:200px}
.lucas{position:relative;width:120px;transition:transform .3s}
.lucas svg,.lucas img{width:100%;height:auto;display:block;filter:drop-shadow(0 0 10px #2bf0ff)}
.lucas.jump{animation:ljump .7s cubic-bezier(.3,1.6,.5,1)}
.lucas.sad{animation:lsad .8s}
@keyframes ljump{30%{transform:translateY(-34px) rotate(-8deg) scale(1.08)}60%{transform:translateY(0) rotate(4deg)}}
@keyframes lsad{30%{transform:rotate(-12deg)}60%{transform:rotate(10deg)}}
.lucas .fl{position:absolute;left:50%;bottom:-12%;width:30%;height:20%;transform:translateX(-50%)}
.lucas .fl i{position:absolute;bottom:0;width:38%;height:100%;border-radius:50% 50% 50% 50%/70% 70% 30% 30%;background:radial-gradient(ellipse at 50% 20%,#fff,#ffe36b 25%,#ff8a2b 55%,transparent 80%);animation:fl .12s infinite alternate}
.lucas .fl i:first-child{left:0}.lucas .fl i:last-child{right:0;animation-delay:.06s}
@keyframes fl{from{transform:scaleY(.75)}to{transform:scaleY(1.2)}}
.bubble{background:#0b1430ee;border:1px solid var(--cy);border-radius:14px;padding:8px 10px;font-size:14px;text-align:center;min-height:38px;box-shadow:0 0 14px #2bf0ff44;max-width:200px}
.chipsOwned{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:220px}
.chipMini{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:18px;border:1px solid var(--k);background:color-mix(in srgb,var(--k) 18%,#060a1c);box-shadow:0 0 8px color-mix(in srgb,var(--k) 60%,transparent);position:relative}
.chipMini em{position:absolute;right:-4px;bottom:-4px;font-style:normal;font-family:Orbitron;font-size:9px;background:#000;border-radius:6px;padding:0 3px;border:1px solid var(--k)}
.ctrl{display:flex;gap:12px;justify-content:center;align-items:center;padding:6px 10px max(12px,env(safe-area-inset-bottom));z-index:6}
.rot{width:78px;height:64px;border-radius:18px;font-size:30px;color:#fff;background:linear-gradient(160deg,#16205a,#0a1030);border:2px solid var(--cy);box-shadow:0 0 18px #2bf0ff77,inset 0 0 14px #2bf0ff33;transition:transform .12s}
.rot:active{transform:scale(.92)}
.rot:disabled{opacity:.3;box-shadow:none}
.rotInfo{display:flex;flex-direction:column;align-items:center;min-width:90px}
.rotInfo b{font-family:Orbitron;font-size:24px;color:var(--cy);text-shadow:0 0 10px var(--cy)}
.rotInfo small{font-size:10px;letter-spacing:.22em;color:var(--mut)}
.pips{display:flex;gap:4px;margin-top:3px}.pips i{width:10px;height:10px;border-radius:50%;background:var(--cy);box-shadow:0 0 6px var(--cy)}.pips i.off{background:#ffffff22;box-shadow:none}
.iconBtn{width:44px;height:44px;border-radius:12px;background:#0b1430cc;border:1px solid #2bf0ff55;font-size:18px}
.lvlTag{font-family:Orbitron;font-size:11px;letter-spacing:.2em;color:var(--mg);text-shadow:0 0 8px var(--mg)}
@media (orientation:portrait),(max-width:760px){.mid{flex-direction:column;gap:14px}.side{flex-direction:row;width:auto;max-width:96vw;gap:8px}.side .lucas{width:54px;flex:none}.side .bubble{max-width:52vw;font-size:13px;min-height:0}.side .chipsOwned{max-width:30vw}.side .chipMini{width:28px;height:28px;font-size:14px}}
@media (orientation:landscape) and (min-width:761px){.ctrl{position:absolute;right:20px;bottom:20px;flex-direction:column}.mid{padding-right:120px}}
/* floating text */
.pop{position:absolute;z-index:40;pointer-events:none;font-family:Orbitron;font-weight:900;white-space:nowrap;transform:translate(-50%,-50%);animation:pop 1.1s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}70%{opacity:1;transform:translate(-50%,-80%) scale(1)}100%{opacity:0;transform:translate(-50%,-120%) scale(.9)}}
.banner{position:fixed;left:0;right:0;top:40%;z-index:45;text-align:center;pointer-events:none;font-family:Orbitron;font-weight:900;font-size:clamp(30px,10vw,80px);letter-spacing:.06em;color:#fff;animation:ban 1.4s cubic-bezier(.2,1.5,.4,1) forwards}
.banner small{display:block;font-size:.3em;letter-spacing:.3em;margin-top:6px}
@keyframes ban{0%{opacity:0;transform:scale(3) rotate(-6deg)}18%{opacity:1;transform:scale(1) rotate(0)}75%{opacity:1;transform:scale(1.04)}100%{opacity:0;transform:scale(.8) translateY(-40px)}}
.shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}30%,50%,70%{transform:translate(-7px,3px)}40%,60%{transform:translate(7px,-3px)}}
.flash{position:fixed;inset:0;z-index:44;pointer-events:none;background:radial-gradient(circle,#ffffff66,transparent 70%);animation:flash .4s forwards}
@keyframes flash{to{opacity:0}}
/* overlays */
.ov{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 14px max(16px,env(safe-area-inset-bottom));background:#02030ad9;backdrop-filter:blur(8px)}
.ov.on{display:flex;animation:fadeIn .35s}
.ovT{font-family:Orbitron;font-weight:900;font-size:clamp(24px,7vw,46px);letter-spacing:.08em;text-align:center;text-shadow:0 0 14px var(--cy),0 0 34px var(--cy)}
.ovS{color:var(--mut);text-align:center;font-size:16px;margin:4px 0 14px;letter-spacing:.06em}
.bigNum{font-family:Orbitron;font-weight:900;font-size:clamp(34px,11vw,72px);color:#fff;text-shadow:0 0 18px var(--am),0 0 40px var(--am)}
.stars{display:flex;gap:10px;font-size:46px;margin:8px 0}
.stars span{filter:grayscale(1) brightness(.4);transform:scale(.6);transition:all .4s cubic-bezier(.2,1.8,.4,1)}
.stars span.on{filter:drop-shadow(0 0 12px #ffc53b);transform:scale(1)}
.chips3{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;perspective:900px;margin:10px 0 16px}
.chip{--k:#2bf0ff;width:min(30vw,200px);min-height:min(48vw,270px);border-radius:18px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;overflow:hidden;
 background:linear-gradient(165deg,color-mix(in srgb,var(--k) 28%,#0b1130),#060914 65%);border:2px solid var(--k);box-shadow:0 0 18px color-mix(in srgb,var(--k) 55%,transparent),inset 0 0 24px color-mix(in srgb,var(--k) 22%,transparent);
 animation:chipIn .6s cubic-bezier(.2,1.4,.4,1) both;transition:transform .2s}
.chip:nth-child(2){animation-delay:.12s}.chip:nth-child(3){animation-delay:.24s}
@keyframes chipIn{from{transform:rotateY(180deg) translateY(60px);opacity:0}}
.chip:hover,.chip:active{transform:translateY(-8px) scale(1.04)}
.chip::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,#ffffff44 48%,transparent 60%);transform:translateX(-130%);animation:holo 3.5s infinite}
@keyframes holo{55%,100%{transform:translateX(130%)}}
.chip .ci{width:70%;aspect-ratio:1;display:grid;place-items:center;font-size:min(13vw,64px);border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--k) 40%,transparent),transparent 70%);filter:drop-shadow(0 0 10px var(--k))}
.chip .ci img{width:100%;height:100%;object-fit:contain}
.chip h4{font-family:Orbitron;font-size:clamp(10px,3vw,14px);letter-spacing:.06em;text-align:center;color:#fff;text-shadow:0 0 8px var(--k)}
.chip p{font-size:clamp(12px,3.3vw,15px);text-align:center;color:#d4e3f7;line-height:1.15}
.chip .rar{position:absolute;top:8px;right:10px;font-family:Orbitron;font-size:9px;letter-spacing:.15em;color:var(--k)}
.rank{width:min(94vw,440px);max-height:52vh;overflow:auto;display:flex;flex-direction:column;gap:6px;margin:8px 0 14px}
.rank div{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:12px;background:#ffffff0c;border:1px solid #ffffff14;font-size:16px}
.rank div b{font-family:Orbitron;width:30px;color:var(--am)}
.rank div span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank div em{font-style:normal;font-family:Orbitron;font-size:14px;color:var(--cy)}
.rank div.me{border-color:var(--mg);box-shadow:0 0 12px #ff2bd655}
.field{width:100%;max-width:320px;padding:14px;border-radius:14px;border:1px solid #2bf0ff55;background:#060c22cc;color:var(--tx);font-size:17px;text-align:center;letter-spacing:.1em;outline:none}
.help{max-width:560px;max-height:66vh;overflow:auto;font-size:17px;line-height:1.35;color:#d6e6ff}
.help h3{font-family:Orbitron;color:var(--cy);font-size:13px;letter-spacing:.12em;margin:12px 0 4px}
.toast{position:fixed;left:50%;top:80px;transform:translateX(-50%);z-index:90;background:#120a1ef0;border:1px solid var(--mg);padding:10px 16px;border-radius:12px;font-size:15px;box-shadow:0 0 20px #ff2bd666;display:none;max-width:90vw;text-align:center}
.toast.on{display:block;animation:fadeIn .3s}
</style>
</head>
<body>
<canvas id="bg"></canvas>

<!-- HOME -->
<section class="screen on" id="home">
  <div class="col">
    <div class="orbit" id="orbit"><div class="ring"></div><div class="ring"></div><div class="core" id="homeLucas"></div></div>
    <div class="logo">GRAVITRÓN</div>
    <div class="tag">Gira la nave · desata los combos</div>
    <div style="height:10px"></div>
    <button class="btn" id="bPlay">▶ JUGAR</button>
    <div class="row" style="max-width:330px;width:100%">
      <button class="btn gh small" id="bRank" style="flex:1">🏆 RANKING</button>
      <button class="btn gh small" id="bHelp" style="flex:1">❔ CÓMO SE JUEGA</button>
    </div>
    <div class="row">
      <button class="btn gh small" id="bShare">📤 COMPARTIR</button>
      <button class="btn gh small" id="bInstall">📲 INSTALAR</button>
    </div>
    <div class="tag" id="bestTag" style="font-size:12px;letter-spacing:.2em"></div>
  </div>
  <div class="foot"><a href="https://puntofibra.github.io/web/" target="_blank" rel="noopener">Web del creador</a></div>
</section>

<!-- GAME -->
<section class="screen" id="game">
  <div class="hud">
    <button class="iconBtn" id="bPause">⏸</button>
    <div class="stat score"><small>PUNTOS</small><b id="hScore">0</b><div class="prog"><i id="hProg" style="width:0"></i></div></div>
    <div class="stat"><small>OBJETIVO</small><b id="hTarget">0</b><span class="lvlTag" id="hLvl">NIVEL 1</span></div>
    <div class="stat moves" id="movesBox"><small>MOVIM.</small><b id="hMoves">0</b></div>
  </div>
  <div class="mid" id="mid">
    <div class="side">
      <div class="lucas" id="lucas"></div>
      <div class="bubble" id="bubble">¡Gira la nave cuando veas un combo!</div>
      <div class="chipsOwned" id="chipsSide"></div>
    </div>
    <div class="boardWrap" id="boardWrap">
      <div class="boardFrame" id="frame"></div>
      <canvas id="board"></canvas>
      <div class="gravArrow">▼ GRAVEDAD ▼</div>
    </div>
  </div>
  <div class="ctrl">
    <button class="rot" id="bRotL" title="Girar a la izquierda (Q)">⟲</button>
    <div class="rotInfo"><b id="hRot">2</b><small>GIROS</small><div class="pips" id="pips"></div></div>
    <button class="rot" id="bRotR" title="Girar a la derecha (E)">⟳</button>
  </div>
</section>

<!-- OVERLAYS -->
<div class="ov" id="ovLevel"><div class="ovT" id="lvT">¡NIVEL SUPERADO!</div><div class="stars" id="stars"><span>⭐</span><span>⭐</span><span>⭐</span></div><div class="bigNum" id="lvScore">0</div><div class="ovS" id="lvSub"></div><button class="btn" id="bNext">ELEGIR MEJORA ▶</button></div>
<div class="ov" id="ovChips"><div class="ovT" style="font-size:clamp(20px,6vw,36px)">ELIGE UN CHIP</div><div class="ovS">Se queda contigo toda la partida</div><div class="chips3" id="chips3"></div></div>
<div class="ov" id="ovOver"><div class="ovT" style="text-shadow:0 0 14px var(--rd),0 0 34px var(--rd)">NAVE SIN ENERGÍA</div><div class="ovS" id="ovInfo"></div><div class="bigNum" id="ovScore">0</div><div class="ovS" id="ovBest"></div>
  <input class="field" id="inName" maxlength="14" placeholder="TU NOMBRE PARA EL RANKING"><div style="height:10px"></div>
  <div class="row" style="width:100%;max-width:330px"><button class="btn mg" id="bSave">🏆 GUARDAR</button></div><div style="height:10px"></div>
  <div class="row"><button class="btn small" id="bRetry">🔁 OTRA VEZ</button><button class="btn gh small" id="bMenu">MENÚ</button></div></div>
<div class="ov" id="ovRank"><div class="ovT" style="font-size:clamp(20px,6vw,36px)">🏆 RANKING</div><div class="rank" id="rankList"><div>Cargando…</div></div><button class="btn gh small" data-close>CERRAR</button></div>
<div class="ov" id="ovHelp"><div class="ovT" style="font-size:clamp(20px,6vw,34px)">CÓMO SE JUEGA</div><div class="help" id="helpBody"></div><div style="height:12px"></div><button class="btn gh small" data-close>¡A JUGAR!</button></div>
<div class="ov" id="ovPause"><div class="ovT">PAUSA</div><div style="height:16px"></div><div class="col"><button class="btn" id="bResume">▶ SEGUIR</button><button class="btn gh small" id="bMute">🔊 SONIDO</button><button class="btn gh small" id="bQuit">SALIR AL MENÚ</button></div></div>
<div class="toast" id="toast"></div>
<canvas id="fx"></canvas>

<script>
/* ================= CONFIG ================= */
const API = 'https://script.google.com/macros/s/AKfycbyPH43mdNyVcgdily_IEKmRSpot0eTsRxVBFWQCTPg1ZU90OYSG7TDUFRwJcKZoe7Y4Cg/exec';
const N = 8;
// Pon aquí las URLs de tus PNG cuando las tengas (mismo orden que los colores). Vacío = se dibujan por código.
const GEM_IMG = ['', '', '', '', '', ''];
const LUCAS_IMG = '';
const GEMS = [

  // agujero negro
  if (a.s === 'x' || b.s === 'x') {
    st.moves--; updHud();
    const hole = a.s === 'x' ? a : b, other = hole === a ? b : a, hr = hole === a ? r2 : r1, hc = hole === a ? c2 : c1;
    const kill = new Set([hr + ',' + hc]); const col = other.s === 'x' ? -1 : other.t;
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (isGem(g[r][c]) && (col < 0 || g[r][c].t === col)) kill.add(r + ',' + c);

async function cascade(chain, afterRot, swapPos, swapPos2){
  const g = st.grid;
  while (true) {
    const runs = findRuns(g); if (!runs.length) break;
    // celdas a limpiar y especiales a crear
    const kill = new Set(), create = [];
    const cnt = {};
    runs.forEach(rn => rn.cells.forEach(([r, c]) => { const k = r + ',' + c; cnt[k] = (cnt[k] || 0) + 1; kill.add(k); }));
    const usedCreate = new Set();
    runs.forEach(rn => {
      const inter = rn.cells.find(([r, c]) => cnt[r + ',' + c] > 1);
      const atSwap = [swapPos, swapPos2].find(p => p && rn.cells.some(([r, c]) => r === p[0] && c === p[1]));
      const pos = inter || atSwap || rn.cells[Math.floor(rn.cells.length / 2)];
      const k = pos[0] + ',' + pos[1]; if (usedCreate.has(k)) return;
      let s = null;
      if (rn.cells.length >= 5) s = 'x'; else if (inter) s = 'b'; else if (rn.cells.length === 4) s = rn.dir === 'h' ? 'h' : 'v';
      if (s) { usedCreate.add(k); create.push({r: pos[0], c: pos[1], s, t: rn.t}); }
    });
    const big = runs.some(r => r.cells.length >= 5);
    await clearSet(kill, chain, {create, afterRot, big});
    swapPos = swapPos2 = null;
    // gravedad + relleno
    gravity();
    await settle();
    chain++;
  }
  if (!hasMove()) {
    if (st.rots > 0) toast('¡Sin jugadas! Gira la nave ⟲ ⟳');
    else { await wait(300); toast('Sin movimientos: ¡reordenando la nave!'); shuffleGems(); await settle(); }
  }
  return chain;
}

// Gravedad por tramos: los asteroides no caen y hacen de suelo. Solo se rellena el tramo que toca el techo:
// los huecos bajo un asteroide se quedan vacíos... hasta que giras la nave.
function gravity(){
  const g = st.grid;
  for (let c = 0; c < N; c++) {
    let bottom = N - 1;
    while (bottom >= 0) {
      let top = bottom; while (top >= 0 && !(g[top][c] && g[top][c].block)) top--;
      // tramo (top, bottom]
      let w = bottom;
      for (let r = bottom; r > top; r--) if (isGem(g[r][c])) { if (w !== r) { g[w][c] = g[r][c]; g[r][c] = null; } w--; }
      if (top < 0) { let k = 0; for (let r = w; r >= 0; r--) { g[r][c] = newGem(rndColor(), r, c, -1 - k - Math.random() * .3); k++; } }
      else for (let r = w; r > top; r--) g[r][c] = null;
      bottom = top - 1;
    }
  }
}
function holes(){ let n = 0; for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!st.grid[r][c]) n++; return n; }

function shuffleGems(){

  const g1 = bg.createRadialGradient(W * (.3 + .1 * Math.sin(t * .2)), H * .25, 0, W * .3, H * .25, W * .6); g1.addColorStop(0, '#3a0f6a55'); g1.addColorStop(1, 'transparent'); bg.fillStyle = g1; bg.fillRect(0, 0, W, H);
  const g2 = bg.createRadialGradient(W * .8, H * (.75 + .08 * Math.cos(t * .25)), 0, W * .8, H * .75, W * .6); g2.addColorStop(0, '#0a3a6a55'); g2.addColorStop(1, 'transparent'); bg.fillStyle = g2; bg.fillRect(0, 0, W, H);
  for (const s of stars) { s.z -= .05 * dt * warp; if (s.z <= 1) { s.z = W; s.x = Math.random() * W - W / 2; s.y = Math.random() * H - H / 2; }
    const k = 160 / s.z, px = s.x * k + W / 2, py = s.y * k + H / 2, r = Math.max(.3, (1 - s.z / W) * 2.2); bg.fillStyle = `rgba(200,230,255,${1 - s.z / W})`;
    if (warp > 2) { const k2 = 160 / (s.z + 12 * warp); bg.strokeStyle = bg.fillStyle; bg.lineWidth = r; bg.beginPath(); bg.moveTo(px, py); bg.lineTo(s.x * k2 + W / 2, s.y * k2 + H / 2); bg.stroke(); } else { bg.beginPath(); bg.arc(px, py, r, 0, 7); bg.fill(); } }
}
function burst(x, y, col, n, spd, o){ o = o || {}; for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, s = (Math.random() * .8 + .2) * (spd || 5); parts.push({x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, dec: .015 + Math.random() * .02, c: col[i % col.length], r: Math.random() * 3 + 1.5, g: o.g == null ? .1 : o.g, spark: o.spark}); } if (parts.length > 900) parts.splice(0, parts.length - 900); }
function confetti(){ const cols = ['#2bf0ff', '#ff2bd6', '#ffc53b', '#2dff8a', '#fff', '#b45bff']; for (let i = 0; i < 150; i++) parts.push({x: Math.random() * W, y: -20 - Math.random() * H * .4, vx: (Math.random() - .5) * 3, vy: Math.random() * 3 + 2, life: 1, dec: .004, c: cols[i % 6], r: 3 + Math.random() * 3, g: .03, conf: true, rot: Math.random() * 6}); }
let beams = [];
function beam(r, c, col){ const b = cv.getBoundingClientRect(); beams.push({r, c, col, life: 1, b}); }
function drawFx(dt){
  fx.clearRect(0, 0, W, H); fx.globalCompositeOperation = 'lighter';
  for (let i = beams.length - 1; i >= 0; i--) { const B = beams[i]; B.life -= dt / 380; if (B.life <= 0) { beams.splice(i, 1); continue; } const b = B.b, w = b.width / N;
    fx.globalAlpha = B.life; fx.fillStyle = B.col; fx.shadowColor = B.col; fx.shadowBlur = 20;
    if (B.r != null) fx.fillRect(b.left - 20, b.top + (B.r + .5) * w - w * .25 * B.life, b.width + 40, w * .5 * B.life);
    else fx.fillRect(b.left + (B.c + .5) * w - w * .25 * B.life, b.top - 20, w * .5 * B.life, b.height + 40); }
  fx.shadowBlur = 0;
  for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= .985; p.life -= p.dec; if (p.life <= 0 || p.y > H + 30) { parts.splice(i, 1); continue; }
    fx.globalAlpha = Math.max(0, p.life); fx.fillStyle = p.c;
    if (p.conf) { fx.save(); fx.translate(p.x, p.y); fx.rotate(p.rot += .1); fx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); fx.restore(); }
    else if (p.spark) { fx.strokeStyle = p.c; fx.lineWidth = 2; fx.beginPath(); fx.moveTo(p.x, p.y); fx.lineTo(p.x - p.vx * 3, p.y - p.vy * 3); fx.stroke(); }
    else { fx.beginPath(); fx.arc(p.x, p.y, p.r * p.life + .4, 0, 7); fx.fill(); } }
  fx.globalAlpha = 1; fx.globalCompositeOperation = 'source-over';
}
function toScreen(r, c){ const b = cv.getBoundingClientRect(); return {x: b.left + (c + .5) * b.width / N, y: b.top + (r + .5) * b.height / N}; }
function popText(x, y, t, col, size){ const d = document.createElement('div'); d.className = 'pop'; d.textContent = t; d.style.cssText = `left:${x}px;top:${y}px;color:#fff;font-size:${size}px;text-shadow:0 0 10px ${col},0 0 24px ${col}`; document.body.appendChild(d); setTimeout(() => d.remove(), 1150); }
function banner(t, s, col){ const d = document.createElement('div'); d.className = 'banner'; d.innerHTML = t + (s ? `<small>${s}</small>` : ''); d.style.textShadow = `0 0 14px ${col},0 0 40px ${col},0 0 80px ${col}`; document.body.appendChild(d); setTimeout(() => d.remove(), 1450); }
function shake(){ const m = $('mid'); m.classList.remove('shake'); void m.offsetWidth; m.classList.add('shake'); vib(80); }
function flash(){ const d = document.createElement('div'); d.className = 'flash'; document.body.appendChild(d); setTimeout(() => d.remove(), 420); }
function countUp(el, to){ const t0 = performance.now(), d = 900; (function f(){ const k = Math.min(1, (performance.now() - t0) / d); el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))).toLocaleString('es-ES'); if (k < 1) requestAnimationFrame(f); })(); }
function toast(m, ms){ const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), ms || 2500); }
function pick(a){ return a[Math.floor(Math.random() * a.length)]; }

  <rect x="16" y="13" width="68" height="46" rx="22" fill="${color}"/><rect x="24" y="23" width="52" height="24" rx="12" fill="#04102a" stroke="#fff" stroke-width="1.5"/>
  <ellipse cx="39" cy="35" rx="5" ry="6" fill="#7ffcff"><animate attributeName="ry" values="6;6;1;6;6" dur="4s" repeatCount="indefinite"/></ellipse><ellipse cx="61" cy="35" rx="5" ry="6" fill="#7ffcff"><animate attributeName="ry" values="6;6;1;6;6" dur="4s" repeatCount="indefinite"/></ellipse>

/* ================= MENÚS ================= */
function show(id){ document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); }

document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => { b.closest('.ov').classList.remove('on'); snd('click'); });

$('bHelp').onclick = () => { snd('click'); $('helpBody').innerHTML = `
  <h3>1 · COMBINA</h3><p>Desliza un núcleo para cambiarlo con el de al lado y junta 3 o más del mismo color.</p>
  <h3>2 · GIRA LA NAVE ⟲ ⟳</h3><p>Tienes pocos giros por nivel. Al girar, el tablero rota 90°, la gravedad cambia y todo cae hacia el nuevo suelo. Los combos tras girar valen <b style="color:var(--cy)">×1,5</b>. Girar no gasta movimientos.</p>
  <h3>☄ ASTEROIDES</h3><p>No caen y hacen de suelo: los huecos que quedan debajo solo se llenan si giras la nave. Rómpelos combinando núcleos a su lado.</p>
  <h3>3 · ESPECIALES</h3><p>4 en línea → <b>RAYO</b> (limpia la fila o columna)<br>En forma de L o T → <b>BOMBA</b> (explota alrededor)<br>5 en línea → <b>AGUJERO NEGRO</b> (cámbialo con un núcleo y se traga todos los de ese color)</p>
  <h3>4 · CHIPS DE MEJORA</h3><p>Al superar cada nivel eliges 1 chip de 3. Se acumulan: combínalos para hacer puntuaciones gigantes. ¿Hasta qué nivel llegas?</p>`; $('ovHelp').classList.add('on'); };
const shareUrl = 'https://puntofibra.github.io/gravitron/';
$('bShare').onclick = async () => { const text = '🌀 GRAVITRÓN — gira la nave y desata los combos. ¿Me superas?';
  if (navigator.share) { try { await navigator.share({title: 'GRAVITRÓN', text, url: shareUrl}); return; } catch(e) { if (e.name === 'AbortError') return; } }
  open('https://wa.me/?text=' + encodeURIComponent(text + ' ' + shareUrl), '_blank'); };

  if (/iphone|ipad|ipod/i.test(navigator.userAgent)) toast('En iPhone: pulsa Compartir ⬆️ y luego "Añadir a pantalla de inicio"', 6000); else toast('Abre el menú ⋮ del navegador y pulsa "Instalar aplicación"', 5000); };
$('bRotL').onclick = () => rotate(-1); $('bRotR').onclick = () => rotate(1);

$('bMute').onclick = () => { muted = !muted; try { localStorage.setItem('gv_mute', muted ? '1' : '0'); } catch(e) {} $('bMute').textContent = muted ? '🔇 SONIDO' : '🔊 SONIDO'; };
$('bQuit').onclick = () => { $('ovPause').classList.remove('on'); st = null; busy = false; show('home'); updBest(); };
